[package]
name = "rusty-boilerplate"
version = "0.1.0"
edition = "2021"
description = "Small, safe Rust project and file scaffolding"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/imsakg/rusty-boilerplate"
readme = "../README.md"
keywords = ["cli", "scaffold", "boilerplate"]

[workspace]

[[bin]]
name = "rusty"
path = "src/main.rs"

[dependencies]
cap-std = "3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.5"

[dev-dependencies]
tempfile = "3"
