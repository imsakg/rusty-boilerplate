name: Scaffold quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path scaffold/Cargo.toml --check
      - run: cargo clippy --manifest-path scaffold/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path scaffold/Cargo.toml --locked
